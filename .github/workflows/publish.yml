name: Publish to pub.dev

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'   # 触发条件：推送 vX.Y.Z 格式的标签

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Run tests
        run: flutter test

  publish:
    name: Publish to pub.dev
    needs: test
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # OIDC 令牌认证，无需存储 pub.dev 凭证

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Publish to pub.dev
        run: flutter pub publish --force
        # --force 跳过交互式确认（CI 环境必须）
        # OIDC 令牌通过 id-token: write 权限自动注入
